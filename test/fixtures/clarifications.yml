# frozen_string_literal: true

# 公開済み・問題に紐付かない clarification（未認証でも閲覧できる）
published_clarification:
  contest: active_contest
  user: member_user
  question: Published question
  answer: Published answer
  publish: true

# 未公開・writer_problem に紐付く clarification
unpublished_clarification:
  contest: active_contest
  problem: writer_problem
  user: member_user
  question: Unpublished question
  publish: false
